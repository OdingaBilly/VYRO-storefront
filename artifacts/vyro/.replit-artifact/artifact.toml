kind = "web"
previewPath = "/"
title = "VYRO"
description = "A premium performance and outdoor lifestyle storefront for VYRO, with a cinematic product catalogue, brand storytelling, and a secure foundation for future commerce."
version = "1.0.0"
id = "artifacts/vyro"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25551

[services.development]
run = "pnpm --filter @workspace/vyro run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vyro", "run", "build" ]
serve = "static"
publicDir = "artifacts/vyro/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25551"
BASE_PATH = "/"
